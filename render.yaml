databases:
  # ============================================
  # Baza Danych PostgreSQL
  # ============================================
  - name: museum-db
    databaseName: museum_db
    user: admin
    plan: free # Render oferuje darmową bazę na 90 dni, potem trzeba zmienić plan

services:
  # ============================================
  # Backend API (Spring Boot) - Serwis Publiczny
  # ============================================
  - type: web # <-- ZMIANA: Z pserv na web
    name: museum-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: museum-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: museum-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: museum-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: museum-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: museum-db
          property: password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: "8080"

  # ============================================
  # Frontend (React + Vite + Nginx)
  # ============================================
  - type: web
    name: museum-frontend
    env: docker
    dockerfilePath: ./web/Dockerfile
    plan: free
    envVars:
      # <-- DODANO: Wstrzyknięcie adresu API do frontendu
      - key: VITE_API_URL
        fromService:
          type: web
          name: museum-backend
          envVarKey: RENDER_EXTERNAL_URL